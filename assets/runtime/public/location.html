<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团餐管家 · 选门店</title>
<style>body{font:16px/1.6 system-ui;background:#f5f6f8;color:#172b38;margin:0}main{max-width:840px;margin:auto;padding:28px}section{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:16px 0}button,input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #aaa;margin:4px}button{cursor:pointer;background:#145e54;color:white}button:disabled{opacity:.5}input{max-width:90%}small{color:#52616a}.store{padding:14px 0;border-top:1px solid #ddd}#message{white-space:pre-wrap}label{display:block}.hidden{display:none}</style>
<main><h1>选择取餐门店</h1><p id="context"></p><p>先选择位置，再选一家门店。本页不会创建订单。</p>
<section><h2>当前位置或常用地点</h2><button id="locate">使用当前位置</button><small>需要浏览器授权；定位可能不精确。授权定位会将坐标交给高德解析及所选品牌适配器查店。</small><div><select id="places"><option value="">选择已保存地点</option></select><button id="use-place">使用常用地点</button><button id="delete-place">删除所选地点</button></div></section>
<section><h2>改用聚餐地点</h2><label>高德地图链接<input id="link" placeholder="粘贴含经纬度的高德分享链接"><button id="use-link">使用地图位置</button></label><label>城市<input id="city" placeholder="例如：杭州市"></label><label>地址或地点<input id="address" placeholder="例如：紫金创业园"><button id="use-address">解析地址</button><button id="manual">按城市和地点查麦当劳</button></label></section>
<p id="message" role="status">正在加载……</p><section id="results" class="hidden"><h2>附近候选门店</h2><p id="position"></p><p id="ordering"></p><label>指定店名关键词<input id="keyword"><button id="search">重新搜索</button></label><div id="stores"></div><button id="more">展开更多</button><hr><label>将当前位置保存为<input id="place-name" placeholder="例如：实验室"><button id="save">确认保存常用地点</button></label><small>仅保存在本机，保存前请核对上面的位置。</small></section><button id="cancel">取消选店</button></main>
<script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let state,lastRequest,found,visible=5,working=false;const $=id=>document.getElementById(id);const msg=text=>$('message').textContent=text;
async function api(path,body){const res=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'x-session-token':token,...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await res.json();if(!res.ok)throw new Error(d.error?.message||'请求未完成');return d;}
async function action(fn){if(working)return;working=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();}catch(e){msg(e.message+'\n可以重试、选择常用地点，或提供地图链接／地址。');}finally{working=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function renderPlaces(places){$('places').replaceChildren(new Option('选择已保存地点',''));places.forEach(p=>$('places').add(new Option(p.name+' · '+p.address,p.id)));}
async function find(request){msg('正在查询门店……');$('results').classList.add('hidden');found=undefined;lastRequest=request;found=await api('find',request);visible=5;render();}
function render(){$('results').classList.remove('hidden');$('position').textContent=found.location.address+(found.location.point?.accuracy_m!==undefined?'；定位精度约 '+Math.round(found.location.point.accuracy_m)+' 米':'');$('ordering').textContent=found.ordering;$('stores').replaceChildren();found.shops.slice(0,visible).forEach(s=>{const box=document.createElement('div');box.className='store';const title=document.createElement('strong');title.textContent=s.name;const p=document.createElement('p');p.textContent=s.address+' · '+s.status+' · '+(s.distance_m===null?'距离未知':s.distance_m+'米（直线估算）');const b=document.createElement('button');b.textContent='选择这家门店';b.onclick=()=>action(async()=>{if(!confirm('确认选择 '+s.name+'？\n'+s.address+'\n此操作仅选店，不下单。'))return;const d=await api('select',{shop_id:s.id,user_confirmed:true});msg(d.message+'\n'+d.shop.name+'\n'+d.shop.address);$('results').classList.add('hidden');setTimeout(()=>document.querySelectorAll('button').forEach(x=>x.disabled=true),0);});box.append(title,p,b);$('stores').append(box);});$('more').hidden=visible>=found.shops.length;msg(found.shops.length?'找到 '+found.shops.length+' 家候选店，请核对地址后选择。':'本次没有找到候选店；不代表附近没有门店，可更换地点或关键词。');}
$('locate').onclick=()=>action(async()=>{if(!navigator.geolocation)throw new Error('此浏览器不支持定位');msg('请允许浏览器定位……');const p=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,()=>reject(new Error('定位被拒绝、超时或不可用')),{enableHighAccuracy:true,timeout:15000,maximumAge:0}));await find({kind:'browser',point:{longitude:p.coords.longitude,latitude:p.coords.latitude,accuracy_m:p.coords.accuracy,coordinate_system:'wgs84',source:'browser',obtained_at:new Date(p.timestamp).toISOString()}});});
$('use-place').onclick=()=>action(()=>find({kind:'saved',place_id:$('places').value}));$('use-link').onclick=()=>action(()=>find({kind:'link',link:$('link').value}));$('use-address').onclick=()=>action(()=>find({kind:'address',address:$('address').value,city:$('city').value}));$('manual').onclick=()=>action(()=>find({kind:'manual',city:$('city').value,keyword:$('address').value}));$('search').onclick=()=>action(()=>find({...lastRequest,keyword:$('keyword').value}));$('more').onclick=()=>{visible+=5;render();};$('save').onclick=()=>action(async()=>{const name=$('place-name').value;if(!confirm('确认将上面的位置保存为“'+name+'”？'))return;const d=await api('save',{name,user_confirmed:true});renderPlaces(d.places);msg('常用地点已保存，仅保存在本机。');});$('delete-place').onclick=()=>action(async()=>{if(!confirm('确认删除所选常用地点？'))return;const d=await api('delete',{place_id:$('places').value,user_confirmed:true});renderPlaces(d.places);msg('已删除常用地点。');});$('cancel').onclick=()=>action(async()=>{await api('cancel',{});msg('已取消，未下单。');});action(async()=>{state=await api('state');renderPlaces(state.places);$('context').textContent=(state.mode==='fixture'?'模拟任务':'真实任务')+' · '+(state.brand==='luckin'?'瑞幸':'麦当劳');$('manual').hidden=state.brand!=='mcd';msg('请选择定位方式。当前位置不会自动保存。');});
</script></html>
